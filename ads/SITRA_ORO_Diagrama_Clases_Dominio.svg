<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <style>
    .bg{fill:#f6f8fc}.title{font:700 34px Arial,sans-serif;fill:#132b4b}.sub{font:18px Arial,sans-serif;fill:#5e6d82}.box{fill:#fff;stroke:#28649c;stroke-width:2}.head{fill:#e5f1ff}.name{font:700 21px Arial,sans-serif;fill:#133c67}.txt{font:15px Arial,sans-serif;fill:#1d2c3f}.op{font:700 15px Arial,sans-serif;fill:#086249}.small{font:13px Arial,sans-serif;fill:#566a80}.rule{fill:#fff8da;stroke:#e2b526;stroke-width:1.5}.rtitle{font:700 16px Arial,sans-serif;fill:#765600}.rtxt{font:14px Arial,sans-serif;fill:#554616}.line{stroke:#65809d;stroke-width:2.5;fill:none}.dash{stroke:#8798a9;stroke-width:2;stroke-dasharray:7 6;fill:none}.label{font:14px Arial,sans-serif;fill:#415a73}.enum{fill:#fff9e8;stroke:#9b7212;stroke-width:1.5;stroke-dasharray:6 4}.diamond{fill:#28649c}
  </style>
  <rect class="bg" width="1800" height="1100"/>
  <text class="title" x="70" y="58">SITRA-ORO · Diagrama de clases del dominio</text>
  <text class="sub" x="70" y="88">S7 · Acopio y liquidación de oro · Modelo derivado de requerimientos y entidades del backend</text>

  <!-- Minero -->
  <g transform="translate(70 175)"><rect class="box" width="310" height="250" rx="12"/><rect class="head" width="310" height="48" rx="12"/><text class="name" x="155" y="30" text-anchor="middle">Minero</text><line class="line" x1="0" y1="48" x2="310" y2="48"/><text class="txt" x="18" y="78">+ idMinero: Long</text><text class="txt" x="18" y="104">+ documentoIdentidad: String</text><text class="txt" x="18" y="130">+ nombresApellidos: String</text><text class="txt" x="18" y="156">+ telefono: String</text><text class="txt" x="18" y="182">+ zonaProcedencia: String</text><text class="txt" x="18" y="208">+ fechaRegistro: LocalDateTime</text><line class="line" x1="0" y1="222" x2="310" y2="222"/><text class="op" x="18" y="244">+ registrar()</text></g>

  <!-- Parametros -->
  <g transform="translate(70 550)"><rect class="box" width="340" height="300" rx="12"/><rect class="head" width="340" height="48" rx="12"/><text class="name" x="170" y="30" text-anchor="middle">ParametrosSistema</text><line class="line" x1="0" y1="48" x2="340" y2="48"/><text class="txt" x="18" y="78">+ idParametro: Long</text><text class="txt" x="18" y="104">+ fecha: LocalDate</text><text class="txt" x="18" y="130">+ precioDiarioGramoPen: Dinero</text><text class="txt" x="18" y="156">+ porcentajeMermaEst: Decimal</text><text class="txt" x="18" y="182">+ cotizacionOnzaUsd: Decimal</text><text class="txt" x="18" y="208">+ tipoCambioUsdPen: Decimal</text><text class="txt" x="18" y="234">+ estado: EstadoParametro</text><line class="line" x1="0" y1="248" x2="340" y2="248"/><text class="op" x="18" y="271">+ estimarCotizacion(pesoBruto)</text><text class="op" x="18" y="292">+ obtenerPrecioG2(tipoOro)</text></g>

  <!-- Transaccion -->
  <g transform="translate(510 190)"><rect class="box" width="360" height="315" rx="12"/><rect class="head" width="360" height="48" rx="12"/><text class="name" x="180" y="30" text-anchor="middle">TransaccionG2</text><line class="line" x1="0" y1="48" x2="360" y2="48"/><text class="txt" x="18" y="78">+ idTransaccionG2: Long</text><text class="txt" x="18" y="104">+ pesoSinFundirG: Peso</text><text class="txt" x="18" y="130">+ pesoFundidoNetoG: Peso</text><text class="txt" x="18" y="156">+ tipoOro: TipoOro</text><text class="txt" x="18" y="182">+ precioAplicadoPen: Dinero</text><text class="txt" x="18" y="208">+ totalPagadoPen: Dinero</text><text class="txt" x="18" y="234">+ fechaTransaccion: LocalDateTime</text><line class="line" x1="0" y1="250" x2="360" y2="250"/><text class="op" x="18" y="275">+ calcularPago()</text><text class="op" x="18" y="299">+ marcarLiquidada()</text></g>

  <!-- Liquidacion -->
  <g transform="translate(1010 150)"><rect class="box" width="390" height="390" rx="12"/><rect class="head" width="390" height="58" rx="12"/><text class="name" x="195" y="28" text-anchor="middle">LiquidacionG1</text><text class="small" x="195" y="47" text-anchor="middle">«raíz de agregado»</text><line class="line" x1="0" y1="58" x2="390" y2="58"/><text class="txt" x="18" y="88">+ idLiquidacionG1: Long</text><text class="txt" x="18" y="114">+ nombreAcopiadorG2: String</text><text class="txt" x="18" y="140">+ estado: EstadoLiquidacion</text><text class="txt" x="18" y="166">+ pesoTotalFundidoG: Peso</text><text class="txt" x="18" y="192">+ tipoOro: TipoOro</text><text class="txt" x="18" y="218">+ cotizacionOnzaUsd: Decimal</text><text class="txt" x="18" y="244">+ tipoCambioUsdPen: Decimal</text><text class="txt" x="18" y="270">+ precioResultanteGramo: Dinero</text><text class="txt" x="18" y="296">+ totalPagadoG2Pen: Dinero</text><line class="line" x1="0" y1="312" x2="390" y2="312"/><text class="op" x="18" y="337">+ agregarDetalle()</text><text class="op" x="18" y="361">+ calcularTotal()</text><text class="op" x="18" y="383">+ anular()</text></g>

  <!-- Detail -->
  <g transform="translate(1490 240)"><rect class="box" width="250" height="260" rx="12"/><rect class="head" width="250" height="48" rx="12"/><text class="name" x="125" y="30" text-anchor="middle">DetalleLiquidacionG1</text><line class="line" x1="0" y1="48" x2="250" y2="48"/><text class="txt" x="15" y="78">+ idDetalle: Long</text><text class="txt" x="15" y="104">+ tipoOro: TipoOro</text><text class="txt" x="15" y="130">+ pesoFundidoG: Peso</text><text class="txt" x="15" y="156">+ precioGramoPen: Dinero</text><text class="txt" x="15" y="182">+ subtotalPen: Dinero</text><line class="line" x1="0" y1="200" x2="250" y2="200"/><text class="op" x="15" y="228">+ calcularSubtotal()</text></g>

  <!-- Relations -->
  <path class="line" d="M380 300 H510"/><text class="label" x="394" y="284">1</text><text class="label" x="474" y="284">0..*</text><text class="small" x="418" y="323">realiza</text>
  <path class="line" d="M870 320 H1010"/><text class="label" x="884" y="303">0..1</text><text class="label" x="960" y="303">0..*</text><text class="small" x="900" y="345">se liquida en</text>
  <polygon class="diamond" points="1400,338 1412,350 1400,362 1388,350"/><path class="line" d="M1412 350 H1490"/><text class="label" x="1418" y="334">1</text><text class="label" x="1456" y="334">1..2</text><text class="small" x="1425" y="374">compone</text>
  <path class="dash" d="M410 650 C480 625 500 520 560 505"/><text class="small" x="385" y="590">usa para cotizar</text>

  <!-- Enums -->
  <g transform="translate(1460 600)"><rect class="enum" width="170" height="130" rx="10"/><text class="name" x="85" y="27" text-anchor="middle" style="font-size:16px">«enumeration»</text><text class="name" x="85" y="50" text-anchor="middle" style="font-size:17px">TipoOro</text><text class="txt" x="20" y="82">ROJO</text><text class="txt" x="20" y="108">VERDE</text></g>
  <g transform="translate(1650 600)"><rect class="enum" width="130" height="130" rx="10"/><text class="name" x="65" y="24" text-anchor="middle" style="font-size:14px">«enum»</text><text class="name" x="65" y="48" text-anchor="middle" style="font-size:15px">Estado</text><text class="txt" x="12" y="82">REGISTRADA</text><text class="txt" x="12" y="108">ANULADA</text></g>

  <!-- Rules -->
  <g transform="translate(500 650)"><rect class="rule" width="850" height="240" rx="12"/><text class="rtitle" x="20" y="32">Restricciones del modelo</text><text class="rtxt" x="25" y="64">{ pesoFundidoNetoG &gt; 0 y pesoFundidoNetoG ≤ pesoSinFundirG }</text><text class="rtxt" x="25" y="94">{ totalPagadoPen = pesoFundidoNetoG × precioAplicadoPen }</text><text class="rtxt" x="25" y="124">{ solo un DetalleLiquidacionG1 por TipoOro dentro de una LiquidacionG1 }</text><text class="rtxt" x="25" y="154">{ no mezclar ROJO y VERDE en los totales acumulados }</text><text class="rtxt" x="25" y="184">{ anular() exige estado = REGISTRADA }</text><text class="rtxt" x="25" y="214">Dinero = monto + moneda · Peso = gramos con 3 decimales</text></g>
  <text class="small" x="70" y="1030">Nota: TipoOro e idLiquidacionG1 están expresados como tipos y asociaciones de dominio; el backend actual aún los persiste como String/Long.</text>
</svg>
