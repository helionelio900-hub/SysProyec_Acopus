<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Figura 5. Diagrama de actividades: registrar compra directa mayorista, por carriles</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
      padding: 25px 30px;
      width: 880px;
      margin: 0 auto;
      color: #1e293b;
      overflow: hidden;
    }

    .canvas {
      position: relative;
      width: 820px;
      background: #ffffff;
    }

    .title {
      font-size: 19px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.3px;
      margin-bottom: 20px;
    }

    svg {
      width: 820px;
      height: 960px;
      display: block;
    }

    .carril-box {
      fill: #f1f5f9;
      stroke: #cbd5e1;
      stroke-width: 1px;
    }

    .carril-title {
      font-size: 10px;
      font-weight: 600;
      fill: #64748b;
      text-anchor: middle;
      letter-spacing: 0.2px;
    }

    .act-box {
      fill: #ccfbf1;
      stroke: #14b8a6;
      stroke-width: 1.2px;
      rx: 3px;
      ry: 3px;
    }

    .act-text {
      font-size: 10.5px;
      font-weight: 500;
      fill: #0f172a;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .diamond {
      fill: #ccfbf1;
      stroke: #14b8a6;
      stroke-width: 1.2px;
    }

    .diamond-text {
      font-size: 10px;
      font-weight: 500;
      fill: #0f172a;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .decision-label {
      font-size: 9.5px;
      font-weight: 600;
      fill: #475569;
    }

    .terminal-pill {
      fill: #ffffff;
      stroke: #14b8a6;
      stroke-width: 1.5px;
      rx: 12px;
      ry: 12px;
    }

    .terminal-text {
      font-size: 10px;
      font-weight: 600;
      fill: #0d9488;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>
</head>
<body>

  <div class="canvas">
    <div class="title">Figura 5. Diagrama de actividades: registrar compra directa mayorista, por carriles</div>

    <svg viewBox="0 0 820 960">
      <defs>
        <!-- Marcador Flecha Flujo -->
        <marker id="flow-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
        </marker>
      </defs>

      <!-- ============================================================== -->
      <!-- 1. CARRILES (SWIMLANES) EN FONDO GRIS CLARO                    -->
      <!-- ============================================================== -->

      <!-- Carril 1: Mayorista (Arriba Derecha) -->
      <rect x="590" y="45" width="220" height="120" class="carril-box" />
      <text x="700" y="60" class="carril-title">Carril: Mayorista</text>

      <!-- Carril 2: CompraDirectaMayoristaController (Medio Derecha) -->
      <rect x="605" y="185" width="190" height="215" class="carril-box" />
      <text x="700" y="200" class="carril-title">Carril: CompraDirectaMayoristaController</text>

      <!-- Carril 3: RecepcionLeyService (Centro / Columna Principal) -->
      <rect x="385" y="340" width="210" height="605" class="carril-box" />
      <text x="490" y="355" class="carril-title">Carril: RecepcionLeyService</text>

      <!-- Carril 4: LeyOroRepository / Pureza (Izquierda Inferior) -->
      <rect x="15" y="560" width="175" height="325" class="carril-box" />
      <text x="102" y="575" class="carril-title">Carril: LeyOroRepository (pureza)</text>

      <!-- ============================================================== -->
      <!-- 2. FLUJOS Y FLECHAS                                            -->
      <!-- ============================================================== -->

      <!-- Flow: Inicio -> Enviar venta -->
      <line x1="700" y1="92" x2="700" y2="110" stroke="#475569" stroke-width="1.2" marker-end="url(#flow-arrow)" />

      <!-- Flow: Enviar venta -> Carril Controller -->
      <line x1="700" y1="146" x2="700" y2="215" stroke="#475569" stroke-width="1.2" marker-end="url(#flow-arrow)" />

      <!-- Flow: Diamond Controller -> No -> Responder 400 -->
      <line x1="700" y1="275" x2="700" y2="335" stroke="#475569" stroke-width="1.2" marker-end="url(#flow-arrow)" />
      <text x="706" y="305" class="decision-label">No</text>

      <!-- Flow: Diamond Controller -> Si -> Service.Iniciar transaccion -->
      <path d="M 645 245 L 575 245 L 500 365" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#flow-arrow)" />
      <text x="615" y="240" class="decision-label">Si</text>

      <!-- Flow: Iniciar transaccion -> Diamond ¿Quedan partidas? -->
      <line x1="490" y1="400" x2="490" y2="435" stroke="#475569" stroke-width="1.2" marker-end="url(#flow-arrow)" />

      <!-- Flow: ¿Quedan partidas? -> Si -> ¿Ley existe? (en Carril LeyOroRepository) -->
      <path d="M 435 470 L 102 530 L 102 590" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#flow-arrow)" />
      <text x="375" y="500" class="decision-label">Si</text>

      <!-- Flow: ¿Ley existe? -> No -> Deshacer 404 -->
      <path d="M 147 620 L 180 620 L 205 660" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#flow-arrow)" />
      <text x="165" y="615" class="decision-label">No</text>

      <!-- Flow: ¿Ley existe? -> Si -> ¿Reglas de peso y adelanto? -->
      <line x1="102" y1="650" x2="102" y2="705" stroke="#475569" stroke-width="1.2" marker-end="url(#flow-arrow)" />
      <text x="109" y="680" class="decision-label">Si</text>

      <!-- Flow: ¿Reglas de peso? -> No -> Deshacer 422 -->
      <path d="M 147 735 L 180 735 L 205 775" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#flow-arrow)" />
      <text x="165" y="730" class="decision-label">No</text>

      <!-- Flow: ¿Reglas de peso? -> Si -> Calcular precio gramo e importe -->
      <line x1="102" y1="765" x2="102" y2="825" stroke="#475569" stroke-width="1.2" marker-end="url(#flow-arrow)" />
      <text x="109" y="795" class="decision-label">Si</text>

      <!-- Flow: Calcular precio gramo -> Armar detalle y sumar al total (retorna a Service) -->
      <path d="M 183 843 L 340 865 L 410 885" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#flow-arrow)" />

      <!-- Loopback Flow: Armar detalle -> Vuelve a ¿Quedan partidas? -->
      <path d="M 570 900 L 585 900 L 585 470 L 545 470" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#flow-arrow)" />

      <!-- Flow: ¿Quedan partidas? -> No -> Guardar compra con sus detalles -->
      <line x1="490" y1="505" x2="490" y2="585" stroke="#475569" stroke-width="1.2" marker-end="url(#flow-arrow)" />
      <text x="496" y="545" class="decision-label">No</text>

      <!-- Flow: Guardar compra -> 201 Created -->
      <line x1="490" y1="625" x2="490" y2="675" stroke="#475569" stroke-width="1.2" marker-end="url(#flow-arrow)" />

      <!-- ============================================================== -->
      <!-- 3. ACTIVIDADES Y NODOS                                         -->
      <!-- ============================================================== -->

      <!-- [Carril: Mayorista] -->
      <!-- Inicio -->
      <rect x="675" y="70" width="50" height="22" class="terminal-pill" />
      <text x="700" y="81" class="terminal-text">Inicio</text>

      <!-- Enviar solicitud con partidas -->
      <rect x="605" y="110" width="190" height="36" class="act-box" />
      <text x="700" y="128" class="act-text">Enviar compra directa con partidas</text>

      <!-- [Carril: Controller] -->
      <!-- Diamond ¿Petición bien formada? -->
      <polygon points="700,215 755,245 700,275 645,245" class="diamond" />
      <text x="700" y="242" class="diamond-text">
        <tspan x="700" dy="-5">¿Petición</tspan>
        <tspan x="700" dy="13">bien formada?</tspan>
      </text>

      <!-- Responder 400 -->
      <rect x="640" y="335" width="120" height="36" class="act-box" />
      <text x="700" y="353" class="act-text">Responder 400</text>

      <!-- [Carril: RecepcionLeyService] -->
      <!-- Iniciar transaccion -->
      <rect x="430" y="365" width="120" height="35" class="act-box" />
      <text x="490" y="382" class="act-text">Iniciar transaccion</text>

      <!-- Diamond ¿Quedan partidas por procesar? -->
      <polygon points="490,435 545,470 490,505 435,470" class="diamond" />
      <text x="490" y="468" class="diamond-text">
        <tspan x="490" dy="-5">¿Quedan partidas</tspan>
        <tspan x="490" dy="13">por procesar?</tspan>
      </text>

      <!-- Guardar recepcion con sus detalles -->
      <rect x="408" y="585" width="164" height="40" class="act-box" />
      <text x="490" y="605" class="act-text">Guardar compra con sus detalles</text>

      <!-- 201 Created (centrado debajo de Guardar compra) -->
      <rect x="450" y="675" width="80" height="24" class="terminal-pill" />
      <text x="490" y="687" class="terminal-text">201 Created</text>

      <!-- [Carril: LeyOroRepository / Pureza] -->
      <!-- Diamond ¿Ley existe? -->
      <polygon points="102,590 147,620 102,650 57,620" class="diamond" />
      <text x="102" y="620" class="diamond-text">¿Ley existe?</text>

      <!-- Deshacer transaccion: 404 (ubicada en espacio entre carriles) -->
      <rect x="205" y="642" width="150" height="36" class="act-box" />
      <text x="280" y="660" class="act-text">Deshacer transaccion: 404</text>

      <!-- Diamond ¿Reglas de peso y adelanto? -->
      <polygon points="102,705 147,735 102,765 57,735" class="diamond" />
      <text x="102" y="732" class="diamond-text">
        <tspan x="102" dy="-5">¿Reglas peso</tspan>
        <tspan x="102" dy="13">y adelanto?</tspan>
      </text>

      <!-- Deshacer transaccion: 422 -->
      <rect x="205" y="757" width="150" height="36" class="act-box" />
      <text x="280" y="775" class="act-text">Deshacer transaccion: 422</text>

      <!-- Calcular precio gramo e importe -->
      <rect x="22" y="825" width="160" height="36" class="act-box" />
      <text x="102" y="843" class="act-text">Calcular precio e importe</text>

      <!-- Armar detalle y sumar al total (en Service) -->
      <rect x="410" y="880" width="160" height="40" class="act-box" />
      <text x="490" y="900" class="act-text">Armar detalle y sumar al total</text>

    </svg>
  </div>

</body>
</html>
