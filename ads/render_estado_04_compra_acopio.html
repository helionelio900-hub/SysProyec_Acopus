<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Figura 6D. Diagrama de estados: Compra Acopiador (Minero)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
      padding: 25px;
      width: 580px;
      margin: 0 auto;
      color: #1e293b;
      overflow: hidden;
    }
    .canvas { position: relative; width: 530px; background: #ffffff; }
    .title { font-size: 17px; font-weight: 700; color: #0f172a; margin-bottom: 20px; }
    svg { width: 530px; height: 560px; display: block; }
    .state-box { fill: #ffffff; stroke: #14b8a6; stroke-width: 1.5px; rx: 5px; ry: 5px; }
    .state-name { font-size: 13px; font-weight: 600; fill: #0f172a; text-anchor: middle; dominant-baseline: central; letter-spacing: 0.5px; }
    .trans-label { font-size: 11px; font-weight: 500; fill: #1e293b; text-anchor: middle; }
    .note-box { fill: #ffffff; stroke: #14b8a6; stroke-width: 1.2px; }
    .note-text { font-size: 10.5px; font-weight: 400; fill: #0f172a; line-height: 1.4; text-anchor: middle; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="title">Figura 6D. Diagrama de estados: Compra Acopiador (Minero)</div>
    <svg viewBox="0 0 530 560">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
        </marker>
      </defs>

      <!-- Estado Inicial -->
      <circle cx="210" cy="35" r="8" fill="#1e293b" />
      <text x="210" y="70" class="trans-label">registrarCompra() exitoso</text>
      <line x1="210" y1="45" x2="210" y2="95" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)" />

      <!-- Estado REGISTRADA -->
      <g transform="translate(210, 120)">
        <rect x="-65" y="-18" width="130" height="36" class="state-box" />
        <text x="0" y="1" class="state-name">REGISTRADA</text>
      </g>

      <!-- Transición: REGISTRADA -> AJUSTADA -->
      <text x="345" y="172" class="trans-label">ajustar() [laboratorio]</text>
      <path d="M 245 138 C 275 160, 290 180, 290 205" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)" />

      <!-- Estado AJUSTADA -->
      <g transform="translate(290, 225)">
        <rect x="-55" y="-18" width="110" height="36" class="state-box" />
        <text x="0" y="1" class="state-name">AJUSTADA</text>
      </g>

      <!-- Transición: REGISTRADA -> Fin (consulta sin cambio) -->
      <text x="60" y="210" class="trans-label">consulta (sin cambio<tspan x="60" dy="14">de estado)</tspan></text>
      <path d="M 175 138 C 110 170, 95 320, 115 415" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)" />

      <!-- Transición: AJUSTADA -> Fin (liquidar pago) -->
      <text x="180" y="295" class="trans-label">liquidar (pago final)</text>
      <path d="M 260 243 C 210 290, 150 360, 128 418" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)" />

      <!-- Estado Final -->
      <circle cx="120" cy="425" r="9" stroke="#0d9488" stroke-width="1.8" fill="#ffffff" />
      <circle cx="120" cy="425" r="5" fill="#0d9488" />

      <!-- Línea discontinua a Nota -->
      <path d="M 330 243 C 370 260, 395 285, 395 320" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,4" />

      <!-- Nota Explicativa -->
      <g transform="translate(390, 410)">
        <rect x="-120" y="-85" width="240" height="170" class="note-box" />
        <text x="0" y="-55" class="note-text">Ajuste de Compra G2</text>
        <text x="0" y="-38" class="note-text">(SITRA-ORO Acopiador):</text>
        <text x="0" y="-15" class="note-text">ajuste de ley tras ensaye químico:</text>
        <text x="0" y="5" class="note-text">recalcula el importe neto al minero</text>
        <text x="0" y="25" class="note-text">por merma o diferencia de ley</text>
        <text x="0" y="45" class="note-text">antes de la liquidación final</text>
      </g>
    </svg>
  </div>
</body>
</html>
