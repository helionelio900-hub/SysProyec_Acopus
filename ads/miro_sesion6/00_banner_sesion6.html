<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Banner Sesión 6</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: transparent;
      padding: 10px;
      display: inline-flex;
      align-items: center;
      gap: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .tag-sesion {
      color: #b91c1c;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: 'Times New Roman', Georgia, serif;
    }
    .box-title {
      border: 2px solid #2563eb;
      padding: 6px 28px;
      border-radius: 4px;
      background: #ffffff;
      color: #1e40af;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.5px;
      font-family: 'Times New Roman', Georgia, serif;
    }
  </style>
</head>
<body>
  <div class="tag-sesion">SESION 6</div>
  <div class="box-title">Integración y Sistemas Empresariales</div>
</body>
</html>
