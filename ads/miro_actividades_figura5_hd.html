<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Diagrama de Actividades por Carriles - Registrar Venta</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f8fafc;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .poster-card {
      width: 1360px;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 20px;
      padding: 40px 48px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
      position: relative;
    }

    .top-header {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 34px;
      font-weight: 900;
      color: #0b3c61;
      text-align: center;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    .fig-title {
      font-size: 17px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 24px;
      padding-left: 8px;
      border-left: 4px solid #0284c7;
    }

    svg {
      width: 100%;
      height: 880px;
      display: block;
      background: #ffffff;
    }

    /* Swimlanes */
    .carril-bg {
      fill: #f8fafc;
      stroke: #cbd5e1;
      stroke-width: 1.5px;
      rx: 8px;
      ry: 8px;
    }
    .carril-title {
      font-size: 13px;
      font-weight: 700;
      fill: #475569;
      text-anchor: middle;
      letter-spacing: 0.3px;
    }

    /* Standard Activities */
    .act-box {
      fill: #ecfdf5;
      stroke: #0d9488;
      stroke-width: 1.6px;
      rx: 6px;
      ry: 6px;
      filter: drop-shadow(0 2px 4px rgba(13, 148, 136, 0.12));
    }
    .act-text {
      font-size: 13px;
      font-weight: 600;
      fill: #064e3b;
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* Error Activities */
    .act-box-error {
      fill: #fef2f2;
      stroke: #ef4444;
      stroke-width: 1.6px;
      rx: 6px;
      ry: 6px;
      filter: drop-shadow(0 2px 4px rgba(239, 68, 68, 0.12));
    }
    .act-text-error {
      font-size: 13px;
      font-weight: 700;
      fill: #991b1b;
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* Diamonds */
    .diamond-shape {
      fill: #eff6ff;
      stroke: #0284c7;
      stroke-width: 1.6px;
      filter: drop-shadow(0 2px 4px rgba(2, 132, 199, 0.12));
    }
    .diamond-text {
      font-size: 12.5px;
      font-weight: 700;
      fill: #0c4a6e;
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* Terminal Pills */
    .term-pill-start {
      fill: #dcfce7;
      stroke: #16a34a;
      stroke-width: 1.8px;
      rx: 16px;
      ry: 16px;
    }
    .term-text-start {
      font-size: 13px;
      font-weight: 800;
      fill: #166534;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .term-pill-end {
      fill: #dcfce7;
      stroke: #16a34a;
      stroke-width: 1.8px;
      rx: 16px;
      ry: 16px;
      filter: drop-shadow(0 2px 4px rgba(22, 163, 74, 0.15));
    }
    .term-text-end {
      font-size: 13px;
      font-weight: 800;
      fill: #166534;
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* Lines and labels */
    .flow-line {
      fill: none;
      stroke: #334155;
      stroke-width: 1.8px;
    }
    .lbl-yes {
      font-size: 12px;
      font-weight: 800;
      fill: #059669;
    }
    .lbl-no {
      font-size: 12px;
      font-weight: 800;
      fill: #dc2626;
    }

    .footer-note {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #64748b;
      font-weight: 500;
      border-top: 1px solid #e2e8f0;
      padding-top: 12px;
    }
    .footer-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 4px 10px;
      border-radius: 6px;
      font-family: monospace;
      font-weight: 600;
      color: #0f172a;
    }
  </style>
</head>
<body>

  <div class="poster-card">
    <div class="top-header">Diagramas de actividades</div>
    <div class="fig-title">Figura 5. Diagrama de actividades: registrar una venta, por carriles</div>

    <svg viewBox="0 0 1260 840">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
        </marker>
        <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444" />
        </marker>
      </defs>

      <!-- ============================================================== -->
      <!-- 1. CARRILES (SWIMLANES)                                        -->
      <!-- ============================================================== -->

      <!-- Carril 1: Vendedor (Arriba Derecha) -->
      <rect x="910" y="20" width="310" height="135" class="carril-bg" />
      <text x="1065" y="42" class="carril-title">Carril: Vendedor</text>

      <!-- Carril 2: VentaController (Medio Derecha) -->
      <rect x="930" y="175" width="270" height="235" class="carril-bg" />
      <text x="1065" y="197" class="carril-title">Carril: VentaController</text>

      <!-- Carril 3: VentaServiceImpl (Centro / Columna Alta) -->
      <rect x="620" y="260" width="280" height="560" class="carril-bg" />
      <text x="760" y="282" class="carril-title">Carril: VentaServiceImpl</text>

      <!-- Carril 4: ProductoService (módulo catálogo) (Izquierda Inferior) -->
      <rect x="40" y="470" width="330" height="350" class="carril-bg" />
      <text x="205" y="492" class="carril-title">Carril: ProductoService (módulo catálogo)</text>

      <!-- ============================================================== -->
      <!-- 2. FLECHAS DE FLUJO                                            -->
      <!-- ============================================================== -->

      <!-- Inicio -> Enviar venta -->
      <line x1="1065" y1="78" x2="1065" y2="98" class="flow-line" marker-end="url(#arr)" />

      <!-- Enviar venta -> ¿Petición bien formada? -->
      <line x1="1065" y1="138" x2="1065" y2="215" class="flow-line" marker-end="url(#arr)" />

      <!-- ¿Petición bien formada? -> No -> Responder 400 -->
      <line x1="1065" y1="275" x2="1065" y2="335" class="flow-line" marker-end="url(#arr)" />
      <text x="1075" y="305" class="lbl-no">No</text>

      <!-- ¿Petición bien formada? -> Si -> Iniciar transaccion (en Service) -->
      <path d="M 995 245 L 760 245 L 760 305" class="flow-line" marker-end="url(#arr)" />
      <text x="965" y="238" class="lbl-yes">Si</text>

      <!-- Iniciar transaccion -> ¿Quedan lineas por procesar? -->
      <line x1="760" y1="347" x2="760" y2="395" class="flow-line" marker-end="url(#arr)" />

      <!-- ¿Quedan lineas? -> No -> Guardar venta con sus detalles -->
      <line x1="760" y1="465" x2="760" y2="540" class="flow-line" marker-end="url(#arr)" />
      <text x="770" y="500" class="lbl-no">No</text>

      <!-- Guardar venta -> 201 Created -->
      <line x1="650" y1="562" x2="560" y2="562" class="flow-line" marker-end="url(#arr)" />

      <!-- ¿Quedan lineas? -> Si -> ¿Producto existe? (hacia Carril ProductoService) -->
      <path d="M 690 430 L 205 430 L 205 520" class="flow-line" marker-end="url(#arr)" />
      <text x="640" y="422" class="lbl-yes">Si</text>

      <!-- ¿Producto existe? -> No -> Deshacer transaccion: 404 -->
      <path d="M 275 550 L 390 550 L 390 575" class="flow-line" marker-end="url(#arr)" />
      <text x="290" y="542" class="lbl-no">No</text>

      <!-- ¿Producto existe? -> Si -> ¿Stock suficiente? -->
      <line x1="205" y1="580" x2="205" y2="630" class="flow-line" marker-end="url(#arr)" />
      <text x="215" y="605" class="lbl-yes">Si</text>

      <!-- ¿Stock suficiente? -> No -> Deshacer transaccion: 409 -->
      <path d="M 275 660 L 440 660 L 440 685" class="flow-line" marker-end="url(#arr)" />
      <text x="290" y="652" class="lbl-no">No</text>

      <!-- ¿Stock suficiente? -> Si -> Descontar stock -->
      <line x1="205" y1="690" x2="205" y2="745" class="flow-line" marker-end="url(#arr)" />
      <text x="215" y="718" class="lbl-yes">Si</text>

      <!-- Descontar stock -> Armar detalle y sumar al total (hacia Service) -->
      <line x1="285" y1="766" x2="660" y2="766" class="flow-line" marker-end="url(#arr)" />

      <!-- Loopback: Armar detalle -> Sube por el carril VentaServiceImpl hasta ¿Quedan lineas? -->
      <path d="M 860 766 L 880 766 L 880 430 L 830 430" class="flow-line" marker-end="url(#arr)" />

      <!-- ============================================================== -->
      <!-- 3. ACTIVIDADES Y NODOS                                         -->
      <!-- ============================================================== -->

      <!-- Carril Vendedor -->
      <!-- Inicio -->
      <rect x="1030" y="52" width="70" height="26" class="term-pill-start" />
      <text x="1065" y="65" class="term-text-start">Inicio</text>

      <!-- Enviar venta con sus lineas -->
      <rect x="960" y="98" width="210" height="40" class="act-box" />
      <text x="1065" y="118" class="act-text">Enviar venta con sus líneas</text>

      <!-- Carril VentaController -->
      <!-- ¿Petición bien formada? -->
      <polygon points="1065,215 1135,245 1065,275 995,245" class="diamond-shape" />
      <text x="1065" y="240" class="diamond-text">
        <tspan x="1065" dy="-6">¿Petición</tspan>
        <tspan x="1065" dy="16">bien formada?</tspan>
      </text>

      <!-- Responder 400 -->
      <rect x="995" y="335" width="140" height="38" class="act-box-error" />
      <text x="1065" y="354" class="act-text-error">Responder 400</text>

      <!-- Carril VentaServiceImpl -->
      <!-- Iniciar transaccion -->
      <rect x="685" y="305" width="150" height="42" class="act-box" />
      <text x="760" y="326" class="act-text">Iniciar transacción</text>

      <!-- ¿Quedan líneas por procesar? -->
      <polygon points="760,395 830,430 760,465 690,430" class="diamond-shape" />
      <text x="760" y="426" class="diamond-text">
        <tspan x="760" dy="-6">¿Quedan</tspan>
        <tspan x="760" dy="16">líneas por procesar?</tspan>
      </text>

      <!-- Guardar venta con sus detalles -->
      <rect x="650" y="540" width="220" height="45" class="act-box" />
      <text x="760" y="562" class="act-text">Guardar venta con sus detalles</text>

      <!-- 201 Created -->
      <rect x="450" y="546" width="110" height="32" class="term-pill-end" />
      <text x="505" y="562" class="term-text-end">201 Created</text>

      <!-- Carril ProductoService (módulo catálogo) -->
      <!-- ¿Producto existe? -->
      <polygon points="205,520 275,550 205,580 135,550" class="diamond-shape" />
      <text x="205" y="550" class="diamond-text">¿Producto existe?</text>

      <!-- Deshacer transaccion: 404 -->
      <rect x="300" y="575" width="180" height="38" class="act-box-error" />
      <text x="390" y="594" class="act-text-error">Deshacer transacción: 404</text>

      <!-- ¿Stock suficiente? -->
      <polygon points="205,630 275,660 205,690 135,660" class="diamond-shape" />
      <text x="205" y="660" class="diamond-text">¿Stock suficiente?</text>

      <!-- Deshacer transaccion: 409 -->
      <rect x="350" y="685" width="180" height="38" class="act-box-error" />
      <text x="440" y="704" class="act-text-error">Deshacer transacción: 409</text>

      <!-- Descontar stock -->
      <rect x="125" y="745" width="160" height="42" class="act-box" />
      <text x="205" y="766" class="act-text">Descontar stock</text>

      <!-- Armar detalle y sumar al total (en Service) -->
      <rect x="660" y="745" width="200" height="42" class="act-box" />
      <text x="760" y="766" class="act-text">Armar detalle y sumar al total</text>

    </svg>

    <div class="footer-note">
      <span>UPeU · Ingeniería de Sistemas · Análisis y Diseño de Sistemas (ADS)</span>
      <div class="footer-badge">
        <span>🔗 Repositorio:</span>
        <span>ads/diagramas_entrega/07_Diagrama_Actividades_Carriles.png</span>
      </div>
      <span>Diseño Editorial Ultra-HD (100% Vectorial)</span>
    </div>
  </div>

</body>
</html>
