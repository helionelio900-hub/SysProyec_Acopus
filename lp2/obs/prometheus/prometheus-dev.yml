global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: sitra-oro-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080
          - host.docker.internal:8081
        labels:
          application: sitra-oro
          environment: dev
