auth_enabled: false

server:
  http_listen_port: 33100
  grpc_listen_port: 0

common:
  path_prefix: ${TEMP}/sitra-oro-loki-data
  storage:
    filesystem:
      chunks_directory: ${TEMP}/sitra-oro-loki-data/chunks
      rules_directory: ${TEMP}/sitra-oro-loki-data/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

analytics:
  reporting_enabled: false
