server:
  http_listen_port: 39080
  grpc_listen_port: 0

positions:
  filename: ${TEMP}/sitra-oro-promtail-evidence-positions.yml

clients:
  - url: http://localhost:33100/loki/api/v1/push

scrape_configs:
  - job_name: sitra-oro-backend
    static_configs:
      - targets:
          - localhost
        labels:
          application: sitra-oro-backend
          environment: dev
          __path__: ${SITRA_ORO_ROOT}/lp2/sitra-oro-backend/logs/bomerp.log
