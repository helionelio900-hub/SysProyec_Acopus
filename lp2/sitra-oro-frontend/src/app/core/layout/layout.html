<div class="shell">
  <header class="header">
    <a routerLink="/" class="brand"
      ><img src="/images/logo-sitra-oro.jpg" alt="" width="38" height="38" />
      <span>SITRA<span>-ORO</span></span></a
    >
    <div class="account">
      <span class="role">{{ rolLabel() }}</span
      ><button mat-button type="button" (click)="cerrarSesion()">Cerrar sesión</button>
    </div>
  </header>
  <aside class="sidebar">
    <p class="section">Espacio de trabajo</p>
    @for (item of navegacion(); track item.ruta) {
      <a
        [routerLink]="item.ruta"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        >{{ item.texto }}</a
      >
    }
  </aside>
  <main class="content" id="main-content"><router-outlet /></main>
</div>
