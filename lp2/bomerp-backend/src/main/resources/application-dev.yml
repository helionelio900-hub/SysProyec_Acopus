server:
  port: 8081
spring:
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/XEPDB1
    username: BOMERP_APP
    password: 123456
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show-sql: true
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
logging:
  level:
    pe.edu.upeu.sitraoro: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
sitraoro:
  cors:
    allowed-origin: http://localhost:4200
