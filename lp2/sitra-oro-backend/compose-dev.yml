name: sitra-oro-backend-dev
services:
  oracle:
    # Oracle XE 21c: la PDB se llama XEPDB1, igual que en application-dev.yml.
    image: gvenzl/oracle-xe:21-slim
    container_name: bomerp-oracle
    restart: unless-stopped
    ports:
      - "1522:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Defina ORACLE_PASSWORD en .env}
      APP_USER: BOMERP_APP
      APP_USER_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
volumes:
  oracle-data:
