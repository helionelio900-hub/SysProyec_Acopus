name: sitra-oro-backend-dev
services:
  oracle:
    # Oracle XE 21c: la PDB se llama XEPDB1, igual que en application-dev.yml.
    image: gvenzl/oracle-xe:21-slim
    container_name: sitra-oro-oracle
    restart: unless-stopped
    ports:
      - "1522:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Defina ORACLE_PASSWORD en .env}
      APP_USER: BOMERP_APP
      APP_USER_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  keycloak-db:
    image: postgres:17-alpine
    container_name: sitra-oro-keycloak-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:35432:5432"
    environment:
      POSTGRES_DB: sitra_keycloak
      POSTGRES_USER: sitra_keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-sitraKeycloakDev2026}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitra_keycloak -d sitra_keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: sitra-oro-keycloak
    restart: unless-stopped
    command: start-dev
    depends_on:
      keycloak-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:38081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-sitraAdminDev2026}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/sitra_keycloak
      KC_DB_USERNAME: sitra_keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-sitraKeycloakDev2026}
    volumes:
      - keycloak-data:/opt/keycloak/data

volumes:
  oracle-data:
    # Copia SITRA del volumen anterior; conservar el original como respaldo hasta validar.
    external: true
    name: sitra-oro-backend-dev_oracle-data
  keycloak-data:
  keycloak-db-data:
