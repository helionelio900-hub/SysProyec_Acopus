# Exclusivo del esquema desechable creado por scripts/probar_oracle.ps1.
spring:
  datasource:
    url: ${ORACLE_TEST_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${ORACLE_TEST_USER}
    password: ${ORACLE_TEST_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: validate
