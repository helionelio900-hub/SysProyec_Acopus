server:
  port: 8080

spring:
  application:
    name: sitra-oro-backend
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${KEYCLOAK_HOST}:${KEYCLOAK_PORT}/realms/Sitra_oro
          jws-algorithms: RS256
  datasource:
    url: jdbc:oracle:thin:@${DB_HOST}:${DB_PORT}/${DB_NAME:FREEPDB1}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  cache:
    type: redis

sitraoro:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4300,http://127.0.0.1:4300}
  security:
    jwt:
      secret: ${SITRAORO_JWT_SECRET:}
  bootstrap:
    mayorista:
      documento: ${SITRAORO_BOOTSTRAP_MAYORISTA_DOCUMENTO:}
      clave: ${SITRAORO_BOOTSTRAP_MAYORISTA_CLAVE:}

bomerp:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4300,http://127.0.0.1:4300}

sitra:
  identidad:
    codart-token: ${SITRA_IDENTIDAD_CODART_TOKEN:Ia6TNace6uayn8OrukeiWuzTiGcy4GKxNCQe5fOKbNOzozJmR8ApQwRkbNmy}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
