server:
  port: 8081
spring:
  config:
    import: optional:file:./application-local.properties
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show-sql: true
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
logging:
  level:
    pe.edu.upeu.sitraoro: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
sitraoro:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200,http://127.0.0.1:4200}
  security:
    jwt:
      secret: ${SITRAORO_JWT_SECRET:}
  bootstrap:
    mayorista:
      documento: ${SITRAORO_BOOTSTRAP_MAYORISTA_DOCUMENTO:}
      clave: ${SITRAORO_BOOTSTRAP_MAYORISTA_CLAVE:}
sitra:
  identidad:
    codart-token: ${SITRA_IDENTIDAD_CODART_TOKEN:Ia6TNace6uayn8OrukeiWuzTiGcy4GKxNCQe5fOKbNOzozJmR8ApQwRkbNmy}

